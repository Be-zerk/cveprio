[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cveprio"
version = "0.1.0"
description = "Evidence-backed, AI-assisted CVE prioritization assistant (portfolio prototype)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
  "packaging>=24",
  "jinja2>=3.1,<4",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0,<2"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
cveprio = "cveprio.cli:main"

[tool.setuptools.packages.find]
include = ["cveprio*"]

[tool.setuptools.package-data]
cveprio = ["templates/*.j2", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: hits real external APIs (opt-in: CVEPRIO_LIVE_TESTS=1)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003", "E501"]  # long prompt/report strings are intentional

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B011"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
